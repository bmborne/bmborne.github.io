<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic ERP reporting and Business Central support flow</title>
  <desc id="desc">Public-safe flow from stakeholder requirements through validation and Business Central-style modules to a reporting model and management views.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a5f7a"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#eef5f8"/>
  <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1a5f7a">SYNTHETIC - PUBLIC-SAFE REFERENCE</text>

  <rect x="24" y="52" width="150" height="78" rx="4" fill="#ffffff" stroke="#1a5f7a" stroke-width="1.5"/>
  <text x="99" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f3d4f">Requirements</text>
  <text x="99" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a6f7a">Finance / Ops needs</text>

  <path d="M184 91 H216" stroke="#1a5f7a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="226" y="52" width="150" height="78" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
  <text x="301" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f3d4f">Validation</text>
  <text x="301" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a6f7a">Data checks / UAT</text>

  <path d="M386 91 H418" stroke="#1a5f7a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="428" y="52" width="268" height="78" rx="4" fill="#ffffff" stroke="#8aabb8" stroke-width="1.5"/>
  <text x="562" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f3d4f">BC-style modules (synthetic)</text>
  <text x="562" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a6f7a">Sales / Purchasing / Inventory / G/L</text>

  <path d="M562 130 V154" stroke="#1a5f7a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="24" y="164" width="672" height="64" rx="4" fill="#1a5f7a"/>
  <text x="360" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Reporting model and stakeholder views</text>
  <text x="360" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#d7eaf0">Public-safe evidence for readiness conversations</text>

  <rect x="24" y="244" width="672" height="40" rx="4" fill="#ffffff" stroke="#c5d9e2"/>
  <text x="360" y="269" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a6f7a">Contribution focus: reporting, validation, UAT support - not full BC configuration ownership</text>
</svg>
