<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="t d">
  <title id="t">Writing follows finished work</title>
  <desc id="d">Sequence from published case evidence to on-site notes then optional external posts.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a5f7a"/>
    </marker>
  </defs>
  <rect width="720" height="220" fill="#eef5f8"/>
  <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1a5f7a">WRITING RULE - EVIDENCE FIRST</text>

  <rect x="24" y="56" width="180" height="78" rx="4" fill="#ffffff" stroke="#1a5f7a" stroke-width="1.5"/>
  <text x="114" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f3d4f">Finished case</text>
  <text x="114" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555555">Stills / CSV / SVG</text>

  <path d="M214 95 H245" stroke="#1a5f7a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="250" y="56" width="180" height="78" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
  <text x="340" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f3d4f">On-site notes</text>
  <text x="340" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555555">Case companions</text>

  <path d="M440 95 H471" stroke="#1a5f7a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="476" y="56" width="220" height="78" rx="4" fill="#1a5f7a"/>
  <text x="586" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">External post</text>
  <text x="586" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#d7eaf0">Only when published</text>

  <rect x="24" y="156" width="672" height="44" rx="4" fill="#ffffff" stroke="#c5d9e2"/>
  <text x="360" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">No empty Medium links - newsletter for live writing</text>
</svg>
